[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bastion-sql"
version = "1.0.0"
description = "Autonomous Zero-Trust Identity Graph, Real-Time Threat Detection, Lateral Movement Analysis, and Forensic Telemetry Kernel in ANSI SQL"
readme = "README.md"
authors = [
    { name = "Aneesh Krishna Parthasarathy", email = "aneeshkrishnaparthasarathy@gmail.com" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = [
    "zero-trust",
    "threat-detection",
    "graph-algorithms",
    "sql-engine",
    "siem",
    "cybersecurity",
    "forensics"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: SQL",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Database :: Database Engines/Servers"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "duckdb>=1.0.0",
    "pytest>=8.0.0"
]

[project.scripts]
bastion = "bastion.cli:main"
